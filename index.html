<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monge Surface Visualization</title>

<style>
    
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #e3f2fd, #bbdefb);
        color: #333;
    }

    
    #container {
        display: flex;
        height: 100vh;
        width: 100vw;
    }

    
    #controls {
        width: 300px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 10px;
        z-index: 10;
    }

    h2 {
        text-align: center;
        margin-top: 0;
        color: #1565c0;
        font-weight: 600;
    }

    label {
        display: inline-block;
        width: 90px;
        font-weight: 500;
    }

    input[type="number"], input[type="range"] {
        width: 100px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    input[type="range"] {
        width: 160px;
    }

    button {
        background-color: #1565c0;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 10px;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 10px;
    }

    button:hover {
        background-color: #0d47a1;
    }

 
    #canvas-holder {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
        background-color: #000;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">
<div id="container">
    <div id="canvas-holder">
        <canvas id="webglcanvas"></canvas>
    </div>
    <div id="controls">
        <h2>Monge Surface</h2>

        <div>
            <label>r (m):</label>
            <input type="number" id="rVal" value="1" step="0.1">
        </div>

        <div>
            <label>c (m):</label>
            <input type="number" id="cVal" value="1" step="0.1">
        </div>

        <div>
            <label>d:</label>
            <input type="number" id="dVal" value="1" step="0.1">
        </div>

        <div>
            <label>θ₀ (π):</label>
            <input type="number" id="theta0Val" value="1.57" step="0.1">
        </div>

        <div>
            <label for="uMaxRange">uMax:</label>
            <input type="range" id="uMaxRange" min="1" max="5" step="0.1" value="2.5" oninput="updateUmax(this.value)">
            <span id="uMaxValue">2.5π</span>
        </div>

        <div>
            <label for="uSlider">U Steps:</label>
            <input type="range" id="uSlider" min="3" max="150" value="100" oninput="updateUSteps(this.value)">
            <span id="uSliderValue">100</span>
        </div>

        <div>
            <label for="vSlider">V Steps:</label>
            <input type="range" id="vSlider" min="3" max="100" value="20" oninput="updateVSteps(this.value)">
            <span id="vSliderValue">20</span>
        </div>
        <div>
            <label>Mode:</label>
            <div style="display: inline-block; margin-left: 10px;">
                <input type="radio" id="modeFill" name="renderMode" value="fill" checked onchange="setRenderMode(this.value)">
                <label for="modeFill">Fill</label>
                <input type="radio" id="modeWire" name="renderMode" value="wireframe" onchange="setRenderMode(this.value)">
                <label for="modeWire">Wireframe</label>
            </div>
        </div>
        <button onclick="updateSurface()">Update Surface</button>
    </div>
    
</div>
</body>
</html>
